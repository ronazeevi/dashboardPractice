name: Build dashboard from Airtable

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dashboard.html from Airtable
        shell: pwsh
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: ./dashboard-output/build-from-airtable.ps1

      - name: Commit the rebuilt dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-output/dashboard.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build: dashboard from Airtable"
            git push
          fi
